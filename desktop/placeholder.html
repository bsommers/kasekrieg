<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KÄSEKRIEG — desktop placeholder</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  #label { position: fixed; left: 12px; bottom: 10px; font: 14px monospace; color: #fde3b0; text-shadow: 1px 1px #000; }
</style>
</head>
<body>
<canvas id="gl" width="320" height="180"></canvas>
<div id="label">KÄSEKRIEG desktop shell — placeholder (game not staged yet)</div>
<script>
// Stand-in page used by smoke mode while the real game (index.html) is not booting yet.
// It proves the shell, the app:// protocol and WebGL2 work: draws a little ray-marched cheese wedge.
(function () {
  const g = window.__game = { ready: false, placeholder: true, state: 'placeholder', errors: [], fps: 0 };
  window.addEventListener('error', (e) => g.errors.push(String(e.message || e)));
  window.addEventListener('unhandledrejection', (e) => g.errors.push('unhandled rejection: ' + (e.reason && e.reason.message || e.reason)));
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl2', { antialias: false });
  if (!gl) { g.errors.push('WEBGL2_UNAVAILABLE'); document.getElementById('label').textContent = 'WebGL2 unavailable'; return; }
  const vs = `#version 300 es
  void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.0-1.0,0,1); }`;
  const fs = `#version 300 es
  precision highp float; uniform vec2 res; uniform float t; out vec4 o;
  float wedge(vec3 p){ // triangular prism with swiss holes
    vec3 q = p; float a = 0.6 + 0.3*sin(t*0.7);
    float c = cos(t*0.5), s = sin(t*0.5); q.xz = mat2(c,-s,s,c)*q.xz;
    float d = max(max(abs(q.y)-0.35, -q.z-0.6), max(q.z*0.5+abs(q.x)-0.55, 0.0) - 0.0);
    d = max(d, -(length(q - vec3(0.15,0.1,0.1))-0.14));
    d = max(d, -(length(q - vec3(-0.2,-0.12,-0.25))-0.11));
    return d;
  }
  void main(){
    vec2 uv = (gl_FragCoord.xy*2.0-res)/res.y;
    vec3 ro = vec3(0,0.6,-2.2), rd = normalize(vec3(uv, 1.6) - vec3(0,0.3,0));
    float tt = 0.0; bool hit = false;
    for (int i=0;i<80;i++){ float d = wedge(ro+rd*tt); if (d<0.002){hit=true;break;} tt += d; if (tt>8.0) break; }
    vec3 col = mix(vec3(0.02,0.02,0.05), vec3(0.08,0.05,0.12), uv.y*0.5+0.5);
    if (hit){
      vec3 p = ro+rd*tt; vec2 e = vec2(0.001,0);
      vec3 n = normalize(vec3(wedge(p+e.xyy)-wedge(p-e.xyy), wedge(p+e.yxy)-wedge(p-e.yxy), wedge(p+e.yyx)-wedge(p-e.yyx)));
      vec3 l = normalize(vec3(-0.5,0.8,-0.4));
      float dif = max(dot(n,l),0.0); float spec = pow(max(dot(reflect(-l,n),-rd),0.0), 24.0);
      col = vec3(0.95,0.66,0.12)*(0.15+0.85*dif) + spec*0.6;
    }
    o = vec4(pow(col, vec3(0.4545)), 1);
  }`;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  let prog;
  try {
    prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (e) { g.errors.push('shader: ' + e.message); return; }
  const uRes = gl.getUniformLocation(prog, 'res'), uT = gl.getUniformLocation(prog, 't');
  const vao = gl.createVertexArray();
  let frames = 0, last = performance.now(), t0 = last;
  function frame(now) {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(prog); gl.bindVertexArray(vao);
    gl.uniform2f(uRes, canvas.width, canvas.height); gl.uniform1f(uT, (now - t0) / 1000);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    frames++;
    if (now - last >= 500) { g.fps = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; }
    if (!g.ready && now - t0 > 200) g.ready = true;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
